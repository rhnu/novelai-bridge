[package]
name = "novelai-bridge"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A Rust library for NovelAI image generation APIs and related helpers."
documentation = "https://docs.rs/novelai-bridge"
homepage = "https://github.com/RhNu/novelai-bridge"
repository = "https://github.com/RhNu/novelai-bridge"
readme = "README.md"
keywords = ["novelai", "image-gen", "api-client", "png", "metadata"]
categories = ["api-bindings", "multimedia::images"]
exclude = ["/agents/**", "/AGENTS.md"]

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
eventsource-stream = "0.2.3"
futures-core = "0.3.32"
futures-util = "0.3.32"
httpdate = "1.0.3"
image = "0.25.9"
log = "0.4.29"
png = "0.18.1"
reqwest = { version = "0.13.2", features = ["json", "stream", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = { version = "3.16.1", features = ["macros"] }
zip = "8.5"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt", "rt-multi-thread"] }
