[package]
name = "novelai-bridge"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
description = "A Rust library for NovelAI image generation APIs and related helpers."
documentation = "https://docs.rs/novelai-bridge"
homepage = "https://github.com/RhNu/novelai-bridge"
repository = "https://github.com/RhNu/novelai-bridge"
readme = "README.md"
keywords = ["novelai", "image-gen", "api-client", "png", "metadata"]
categories = ["api-bindings", "multimedia::images"]
exclude = [
    "/.cargo/**",
    "/agents/**",
    "/AGENTS.md",
    "/scripts/**",
]

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
eventsource-stream = "0.2.3"
futures-core = "0.3.32"
futures-util = "0.3.32"
httpdate = "1.0.3"
image = "0.25.10"
log = "0.4.29"
png = "0.18.1"
reqwest = { version = "0.13.3", features = ["json", "stream", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = { version = "3.20.0", features = ["macros"] }
thiserror = "2.0.17"
zip = "8.6.0"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
