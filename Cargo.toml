[package]
name = "novelai-bridge"
version = "0.5.0-rc.1"
edition = "2024"
license = "Apache-2.0"
description = "A Rust library for NovelAI image generation APIs and related helpers."
documentation = "https://docs.rs/novelai-bridge"
homepage = "https://github.com/RhNu/novelai-bridge"
repository = "https://github.com/RhNu/novelai-bridge"
readme = "README.md"
keywords = ["novelai", "image-gen", "api-client", "png", "metadata"]
categories = ["api-bindings", "multimedia::images"]
exclude = [
    "/.cargo/**",
    "/agents/**",
    "/AGENTS.md",
    "/crates/**",
    "/scripts/**",
    "/xtask/**",
]

[workspace]
members = ["crates/tokenizer-assets", "xtask"]
resolver = "3"

[workspace.dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
eventsource-stream = "0.2.3"
fancy-regex = "0.19.0"
flate2 = "1.1.10"
futures-core = "0.3.34"
futures-util = "0.3.34"
httpdate = "1.0.3"
image = "0.25.10"
log = "0.4.33"
novelai-bridge = { path = ".", version = "0.5.0-rc.1" }
novelai-bridge-tokenizer-assets = { path = "crates/tokenizer-assets", version = "=0.1.0" }
png = "0.18.1"
reqwest = { version = "0.13.4", features = ["json", "stream", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.22.0", features = ["macros"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
toml = "1.0"
unicode-normalization = "0.1.25"
zip = "8.6.0"

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
eventsource-stream.workspace = true
fancy-regex = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
futures-core.workspace = true
futures-util.workspace = true
httpdate.workspace = true
image.workspace = true
log.workspace = true
novelai-bridge-tokenizer-assets = { workspace = true, optional = true }
png.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
thiserror.workspace = true
unicode-normalization = { workspace = true, optional = true }
zip.workspace = true

[dev-dependencies]
sha2.workspace = true
tokio.workspace = true

[features]
default = ["tokenizer"]
# Local CLIP / T5 / Qwen prompt tokenizers. Disable to drop the regex, Unicode and gzip
# dependencies when only request building and metadata helpers are needed.
tokenizer = ["dep:fancy-regex", "dep:unicode-normalization", "dep:flate2"]
# Embeds pinned upstream assets from the independently versioned asset package.
bundled-assets = ["tokenizer", "dep:novelai-bridge-tokenizer-assets"]
