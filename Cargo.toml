[package]
name = "novelai-bridge"
version = "0.7.2"
edition = "2024"
autotests = false
license = "Apache-2.0"
description = "A Rust library for NovelAI image generation APIs and related helpers."
documentation = "https://docs.rs/novelai-bridge"
homepage = "https://github.com/rhnu/novelai-bridge"
repository = "https://github.com/rhnu/novelai-bridge"
readme = "README.md"
keywords = ["novelai", "image-gen", "api-client", "png", "metadata"]
categories = ["api-bindings", "multimedia::images"]
exclude = [
    "/.cargo/**",
    "/agents/**",
    "/AGENTS.md",
    "/crates/**",
    "/scripts/**",
    "/xtask/**",
]

[workspace]
members = ["crates/tokenizer-assets", "xtask"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
eventsource-stream = "0.2.3"
fancy-regex = "0.19.2"
flate2 = "1.1.10"
futures-core = "0.3.34"
futures-util = "0.3.34"
form_urlencoded = "1.2.2"
getrandom = { version = "0.4.3", features = ["std"] }
httpdate = "1.0.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
indexmap = { version = "2.14.2", features = ["serde"] }
kamadak-exif = "0.6.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
novelai-bridge = { path = ".", version = "0.7.2" }
novelai-bridge-tokenizer-assets = { path = "crates/tokenizer-assets", version = "=0.1.0" }
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "stream",
    "rustls",
] }
rmp-serde = "1.3.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = { version = "3.24.0", features = ["macros"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt", "rt-multi-thread"] }
toml = "1.1.8"
unicode-normalization = "0.1.26"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
eventsource-stream.workspace = true
fancy-regex = { workspace = true, optional = true }
flate2.workspace = true
futures-core.workspace = true
futures-util.workspace = true
form_urlencoded.workspace = true
getrandom.workspace = true
httpdate.workspace = true
hmac.workspace = true
image.workspace = true
indexmap.workspace = true
kamadak-exif.workspace = true
tracing.workspace = true
novelai-bridge-tokenizer-assets = { workspace = true, optional = true }
png.workspace = true
reqwest = { workspace = true, optional = true }
rmp-serde.workspace = true
secrecy = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization = { workspace = true, optional = true }
zip.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

[[test]]
name = "client"

[features]
default = ["reqwest-transport", "tokenizer"]
# Optional authenticated HTTP adapter; custom transports use the complete core API.
reqwest-transport = ["dep:reqwest", "dep:secrecy"]
# Local CLIP, T5 and Qwen encoding without embedded assets.
tokenizer = ["dep:fancy-regex", "dep:unicode-normalization"]
# Pinned embedded tokenizer assets remain opt-in.
bundled-assets = ["tokenizer", "dep:novelai-bridge-tokenizer-assets"]
